  <style>
    tr{
      background-color: blue;
      color: white;

    }
    #doggy { /* id selector*/
      background-color: green;
    }
    .yellow { /* class selector */
      background-color: yellow;
      color: black;
    }
    #doggy, .yellow{
       background-color: orange;
    }

  </style>
</head>

    <th>Cats</th>
  </tr>
  <tr id="doggy" class="yellow">
<!--    td is table data-->
    <td>Sable</td>
    <td class="yellow">Kitty</td>
  </tr>
  <tr>
    <td>Ruff</td>
    <td class="yellow">Meow</td>
