<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM - Form Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form action="" method="get">
    <label for="first_name"></label>
    <input type="text" name="fname" id="first_name" placeholder="First Name">

    <label for="last_name"></label>
    <input type="text" name="lname" id="last_name" placeholder="Last Name">

    <label for="password"></label>
    <input type="password" name="pword" id="password" placeholder="Password">

    <button type="submit">Submit</button>

</form>


<script src="script.js" ></script>
</body>
</html>
